<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us Eminent rafting company</title>
    <meta name="description"
      content="Contact Us page for white water rafting page on WDD 130 showcasing HTML, CSS, and project work.">
    <meta name="author" content="Isaac Agyare Adjei">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rafting_logo_new_.jpg" alt="rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <h1>Eminent Rafting Company - Contact Us</h1>

        <section class="contact-info">
            <h2>Eminent Rafting Company</h2>
            <p>2249 Aplaku Road, Weija-Accra, Ga-South</p>
            <p>Phone: (+233) 599-699-3945</p>
            <p>Email: eminent164@gmail.com</p>

            <section class="middle-section">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12161.947751084761!2d-0.32778405!3d5.5301446499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sgh!4v1790711750455!5m2!1sen!2sgh"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>

                <section class="contact-form">
                    <fieldset>
                        <legend>
                            <h2>Send Us a Message</h2>
                        </legend>
                        <form>
                            <div class="form-row">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name">
                            </div>

                            <div class="form-row">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email">
                            </div>

                            <div class="form-row">
                                <p>Message Purpose</p>
                                <div class="radio-group">
                                    <div>
                                        <label>
                                            <input type="radio" id="purpose-general" name="purpose"
                                              value="general-inquiry">
                                            General Inquiry
                                        </label>
                                    </div>
                                    <div>
                                        <label>
                                            <input type="radio" id="purpose-reservation"
                                              name="purpose" value="reservation-question">
                                            Reservation Question
                                        </label>
                                    </div>
                                    <div>
                                        <label>
                                            <input type="radio" id="purpose-website" name="purpose"
                                              value="website-suggestion">
                                            Website Suggestion
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label for="message">Message</label>
                                <textarea id="message" name="message"></textarea>
                            </div>

                            <label>
                                <input type="checkbox" id="newsletter" name="newsletter">
                                Please subscribe me to the monthly newsletter
                            </label>

                            <div>
                                <button type="submit">Send Message</button>
                            </div>
                        </form>
                    </fieldset>
                </section>
            </section>
        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>
            <figure>
                <img src="images/adv_3jpg.jpg" alt="John Smith">
                <figcaption>John Smith - General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/adv2.jpg" alt="Sarah Jones">
                <figcaption>Sarah Jones - Reservation Specialist</figcaption>
            </figure>

            <figure>
                <img src="images/adv_1.webp" alt="Mike Brown">
                <figcaption>Mike Brown - River Guide</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Instagram Icon">
            </a>
        </nav>
        <p>&copy; 2026 Isaac Agyare Adjei | Eminent Rafting Co.</p>
    </footer>
</body>

</html>
