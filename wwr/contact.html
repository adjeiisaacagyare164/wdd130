<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Eminent Rafting Co.</title>
    <meta name="description"
      content="Contact Eminent Rafting Company: find our address, phone, email, location map, and a form to send us a message or subscribe to updates.">
    <meta name="author" content="Isaac Agyare Adjei">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <a href="index.html">
            <img src="images/rafting_logo_new_.jpg" alt="Eminent Rafting Co. home">
        </a>
        <nav aria-label="Main">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" aria-current="page">Contact Us</a>
        </nav>
    </header>

    <main>

        <section class="contact-info">
            <h1>Eminent Rafting Company</h1>
            <address>
                2249 Aplaku Road<br>
                Weija-Accra, Ga-South<br>
                <a href="tel:+2335996993945">(+233) 599-699-3945</a><br>
                <a href="mailto:eminent164@gmail.com">eminent164@gmail.com</a>
            </address>
        </section>


        <div class="middle-section">
            <iframe title="Map showing the location of Eminent Rafting Company"
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d12161.947751084761!2d-0.32778405!3d5.5301446499999996!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sgh!4v1790711750455!5m2!1sen!2sgh"
              allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <section class="contact-form">
                <form aria-label="Contact form">
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email" required>
                    </div>

                    <div class="form-row" role="group" aria-labelledby="purpose-label">
                        <p id="purpose-label">Message Purpose</p>
                        <div class="radio-group">
                            <label>
                                <input type="radio" id="purpose-general" name="purpose"
                                  value="general-inquiry" checked>
                                General Inquiry
                            </label>
                            <label>
                                <input type="radio" id="purpose-reservation" name="purpose"
                                  value="reservation-question">
                                Reservation Question
                            </label>
                            <label>
                                <input type="radio" id="purpose-website" name="purpose"
                                  value="website-suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>

                    <div>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>

                    <label>
                        <input type="checkbox" id="newsletter" name="newsletter">
                        Please subscribe me to the monthly newsletter
                    </label>

                    <div>
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </section>
        </div>

        <!-- Team -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/adv_3jpg.jpg" alt="Portrait of John Smith" loading="lazy">
                <figcaption>John Smith, General Manager</figcaption>
            </figure>

            <figure>
                <img src="images/adv2.jpg" alt="Portrait of Sarah Jones" loading="lazy">
                <figcaption>Sarah Jones, Reservation Specialist</figcaption>
            </figure>

            <figure>
                <img src="images/adv_1.webp" alt="Portrait of Mike Brown" loading="lazy">
                <figcaption>Mike Brown, River Guide</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <nav class="socialmedia" aria-label="Social media">
            <a href="https://facebook.com" rel="noopener" aria-label="Eminent Rafting on Facebook">
                <img src="images/facebook.webp" alt="" loading="lazy">
            </a>
            <a href="https://linkedin.com" rel="noopener" aria-label="Eminent Rafting on LinkedIn">
                <img src="images/linkedin.webp" alt="" loading="lazy">
            </a>
            <a href="https://instagram.com" rel="noopener"
              aria-label="Eminent Rafting on Instagram">
                <img src="images/instagram.jpg" alt="" loading="lazy">
            </a>
        </nav>
        <p>&copy; 2026 Isaac Agyare Adjei | Eminent Rafting Co.</p>
    </footer>
</body>

</html>
