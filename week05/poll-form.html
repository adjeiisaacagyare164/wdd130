<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WDD 130 | HTML Form User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </p>
                <p>
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </p>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>
                <p>
                    <label for="browser">What is your favorite browser?</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="other">Other</option>
                    </select>
                </p>

                <p>
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </p>

                <p>
                    <label for="places">List the places you have lived:</label><br>
                    <textarea id="places" name="places" rows="6"
                      placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
                </p>
            </fieldset>

            <p><button type="submit">Submit Poll</button></p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | HTML Form-User Poll Activity | Isaac Adjei Agyare</p>
    </footer>
</body>

</html>
